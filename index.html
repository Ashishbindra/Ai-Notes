<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Notes</title>
    <link rel="icon" type="image/png" href="./image/Ainotes.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dark.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <div class="app-shell">

        <header class="header">
            <div class="header-left">
                <button class="menu-btn ripple"><span class="material-icons">menu</span></button>
                <div class="title-group">
                    <h1>AI Notes</h1>
                    <small>Smart Notes</small>
                </div>
            </div>

            <div class="header-right">
                <button class="theme-btn icon-btn ripple">
                    <span class="material-icons">dark_mode</span>
                </button>
            </div>
        </header>

        <section class="search-section">
            <div class="search-box">
                <span class="material-icons search-icon">search</span>
                <input id="searchInput" type="search" placeholder="Search your notes..." autocomplete="off">
                <button id="clearSearch" type="button">
                    <span class="material-icons">close</span>
                </button>
            </div>
        </section>

        <main id="notesContainer" class="notes-container"></main>

        <button id="addNote" class="fab ripple">
            <span class="material-icons">add</span>
        </button>

        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <div class="drawer-logo">
                    <span class="material-icons">auto_awesome</span>
                </div>
                <div>
                    <h2>AI Notes</h2>
                    <p>Version 2.0</p>
                </div>
            </div>

            <div class="drawer-menu">
                <div class="drawer-item" id="allNotes"><span class="material-icons">description</span><span>All
                        Notes</span></div>
                <div class="drawer-item" id="favoriteNotes"><span
                        class="material-icons">star</span><span>Favorites</span></div>
                <div class="drawer-item" id="pinnedNotes"><span
                        class="material-icons">push_pin</span><span>Pinned</span></div>
                <div class="drawer-item" id="exportNotes"><span class="material-icons">download</span><span>Export
                        Notes</span></div>
                <div class="drawer-item" id="importNotes">
                    <span class="material-icons">upload_file</span>
                    <span>Import Notes</span>
                    <input type="file" id="importFile" accept=".json" hidden>
                </div>
            </div>

            <div class="drawer-footer">
                Made with ❤️ by AI Notes
            </div>
        </div>

        <div class="drawer-overlay" id="drawerOverlay"></div>

        <div class="popup-menu" id="popupMenu">
            <button id="shareAction"><span class="material-icons">share</span><span>Share</span></button>
            <button id="copyAction"><span class="material-icons">content_copy</span><span>Copy</span></button>
            <button id="deleteAction"><span class="material-icons">delete</span><span>Delete</span></button>
        </div>

        <div class="dialog-overlay" id="dialogOverlay">
            <div class="dialog-box">
                <span class="material-icons dialog-icon">delete</span>
                <h2>Delete Note?</h2>
                <p>This note will be permanently deleted.</p>
                <div class="dialog-buttons">
                    <button id="cancelDelete">Cancel</button>
                    <button id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>

    </div>

    <script src="js/theme.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/share.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
